<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root { --sky1: #7fb7e6; --sky2: #d9ecfa; --ink: #14213d; --accent: #e63946; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; overflow: hidden;
         font-family: Georgia, "Times New Roman", serif; color: var(--ink);
         background: linear-gradient(var(--sky1), var(--sky2)); }
  .cloud { position: absolute; background: #fff; border-radius: 100px; opacity: .85; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 50%; height: 100%; top: -50%; left: 15%; }
  .cloud::after { width: 35%; height: 80%; top: -30%; right: 15%; }
  .c1 { width: 160px; height: 40px; top: 12%; left: -200px; animation-duration: 40s; }
  .c2 { width: 220px; height: 52px; top: 30%; left: -260px; animation-duration: 60s; animation-delay: -20s; }
  .c3 { width: 120px; height: 30px; top: 72%; left: -160px; animation-duration: 50s; animation-delay: -35s; }
  @keyframes drift { to { transform: translateX(calc(100vw + 400px)); } }
  main { position: relative; z-index: 1; max-width: 560px; }
  h1 { font-size: clamp(5rem, 22vw, 9rem); line-height: 1; letter-spacing: .05em; }
  h1 span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  h1 span:nth-child(2) { animation-delay: .3s; color: var(--accent); }
  h1 span:nth-child(3) { animation-delay: .6s; }
  @keyframes bob { 50% { transform: translateY(-12px); } }
  svg { width: min(260px, 70vw); margin: 8px 0; }
  .caption { font-size: clamp(1.3rem, 5vw, 2rem); font-style: italic; margin-top: 4px; }
  p { margin-top: 10px; font-size: 1.05rem; }
  a { display: inline-block; margin-top: 22px; padding: 12px 26px; border-radius: 999px; background: var(--ink);
      color: #fff; text-decoration: none; transition: transform .2s, background .2s; }
  a:hover { transform: scale(1.06); background: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<main>
  <h1><span>4</span><span>0</span><span>4</span></h1>
  <svg viewBox="0 0 260 130" role="img" aria-label="A pipe, in the style of Magritte">
    <path d="M60 26 C48 16 72 10 60 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
    <rect x="30" y="40" width="60" height="70" rx="14" fill="#7a4a24"/>
    <rect x="24" y="32" width="72" height="14" rx="7" fill="#4a2b14"/>
    <path d="M88 96 C140 96 160 118 232 118" stroke="#2b1a0e" stroke-width="12" fill="none" stroke-linecap="round"/>
  </svg>
  <p class="caption">Ceci n'est pas une page.</p>
  <p>The page you are looking for does not exist. Like the pipe, it is only an idea.</p>
  <a href="/">Back to the real world</a>
</main>
</body>
</html>
